<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151211" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Void Links — short links with click analytics, custom domains and no account required."
    />
    <link rel="manifest" href="/manifest.json" />
    <title>Void Links — Short links, clear signal</title>
    <script>
      // Resolve theme + accent before the stylesheet loads so the first paint is
      // never a white flash and already uses the shared VoidSuite appearance.
      (function () {
        var ACCENTS = {
          mono: null,
          violet: { light: ["#6d28d9", "#faf5ff", "#5b21b6", "rgb(109 40 217 / 0.25)"], dark: ["#a78bfa", "#1c1917", "#c4b5fd", "rgb(167 139 250 / 0.3)"] },
          blue: { light: ["#1d4ed8", "#eff6ff", "#1e40af", "rgb(29 78 216 / 0.25)"], dark: ["#60a5fa", "#151211", "#93c5fd", "rgb(96 165 250 / 0.3)"] },
          emerald: { light: ["#047857", "#ecfdf5", "#065f46", "rgb(4 120 87 / 0.25)"], dark: ["#34d399", "#151211", "#6ee7b7", "rgb(52 211 153 / 0.3)"] },
          amber: { light: ["#b45309", "#fffbeb", "#92400e", "rgb(180 83 9 / 0.25)"], dark: ["#fbbf24", "#151211", "#fcd34d", "rgb(251 191 36 / 0.3)"] },
          rose: { light: ["#be123c", "#fff1f2", "#9f1239", "rgb(190 18 60 / 0.25)"], dark: ["#fb7185", "#151211", "#fda4af", "rgb(251 113 133 / 0.3)"] }
        };
        try {
          var theme = localStorage.getItem("theme");
          var accent = localStorage.getItem("void-accent");
          var match = document.cookie.match(/(?:^|; )void_appearance=([^;]+)/);
          if (match) {
            var parts = decodeURIComponent(match[1]).split(":");
            if (parts[0]) theme = parts[0];
            if (parts[1]) accent = parts[1];
          }
          var resolved =
            theme === "light" || theme === "dark"
              ? theme
              : theme === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : "system";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
          var palette = ACCENTS[accent] && ACCENTS[accent][resolved];
          if (palette) {
            var root = document.documentElement.style;
            root.setProperty("--primary", palette[0]);
            root.setProperty("--primary-foreground", palette[1]);
            root.setProperty("--brand", palette[0]);
            root.setProperty("--brand-foreground", palette[1]);
            root.setProperty("--brand-hover", palette[2]);
            root.setProperty("--brand-glow", palette[3]);
            root.setProperty("--sidebar-primary", palette[0]);
            root.setProperty("--sidebar-primary-foreground", palette[1]);
          }
        } catch (e) {
          document.documentElement.classList.add("system");
          document.documentElement.style.colorScheme = "system";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
